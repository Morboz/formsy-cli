name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: New, immutable tag to build and publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build x86_64-unknown-linux-gnu (Ubuntu 20.04)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify
        run: cargo test --locked

      - name: Build
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::release checkout contains tracked modifications"
            exit 1
          fi
          FSY_BUILD_GIT_COMMIT="$(git rev-parse HEAD)" \
          FSY_BUILD_GIT_DIRTY=false \
            cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verify build identity and capabilities
        shell: bash
        run: |
          binary="target/x86_64-unknown-linux-gnu/release/fsy"
          expected_commit="$(git rev-parse HEAD)"
          "${binary}" capabilities --json > capabilities.json
          python3 - capabilities.json "${expected_commit}" <<'PY'
          import json, sys

          path, expected = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          required = {
              "compile.task_source.v1",
              "compile.test_file_mutation_policy.v1",
              "query.task_identity.v1",
              "source.auto_extensions.v1",
          }
          assert payload.get("schema_version") == "formsy.cli_capabilities.v1"
          assert payload.get("git_commit") == expected
          assert payload.get("git_dirty") is False
          assert payload.get("target") == "x86_64-unknown-linux-gnu"
          assert required <= set(payload.get("capabilities", []))
          PY

      - name: Verify Ubuntu 20.04 compatibility
        shell: bash
        run: |
          binary="target/x86_64-unknown-linux-gnu/release/fsy"
          max_glibc="$({ readelf --version-info "$binary" || true; } \
            | grep -o 'GLIBC_[0-9][0-9.]*' \
            | sort -Vu \
            | tail -1)"
          echo "Highest required GLIBC symbol version: ${max_glibc:-none}"
          if [ -n "$max_glibc" ] && [ "$(printf '%s\n' "$max_glibc" GLIBC_2.31 | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::binary requires $max_glibc, newer than Ubuntu 20.04's GLIBC_2.31"
            exit 1
          fi

      - name: Package Linux binary
        shell: bash
        run: |
          archive="fsy-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/x86_64-unknown-linux-gnu/release -czf "$archive" fsy
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: fsy-x86_64-unknown-linux-gnu
          path: |
            fsy-x86_64-unknown-linux-gnu.tar.gz
            fsy-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify
        run: cargo test --locked

      - name: Build
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::release checkout contains tracked modifications"
            exit 1
          fi
          FSY_BUILD_GIT_COMMIT="$(git rev-parse HEAD)" \
          FSY_BUILD_GIT_DIRTY=false \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="fsy-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" fsy
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "fsy-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/fsy.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: fsy-${{ matrix.target }}
          path: |
            fsy-${{ matrix.target }}.${{ matrix.archive }}
            fsy-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-linux, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release ${RELEASE_TAG} already exists; release assets are immutable"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
