[package]
name = "formsy-cli"
version = "0.2.0"
edition = "2021"
description = "Rust CLI client for formsy.server /api/v1/compile and /api/v1/query"
license = "MIT"

[[bin]]
name = "fsy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
walkdir = "2"

[profile.release]
lto = "thin"
